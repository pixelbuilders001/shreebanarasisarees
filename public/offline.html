<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | Shree Banarasi Sarees</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <style>
    :root {
      --background: #FFF9F0;
      --text: #2D211D;
      --maroon: #801F32;
      --gold: #C9A45C;
      --cream: #F7EEDF;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--background);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Georgia, serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    .container {
      max-width: 450px;
      background: white;
      padding: 40px 32px;
      border-radius: 24px;
      border: 1px solid rgba(201, 164, 92, 0.25);
      box-shadow: 0 10px 30px rgba(45, 33, 29, 0.05);
    }

    .logo-container {
      margin-bottom: 24px;
    }

    .logo {
      width: 90px;
      height: 90px;
      object-fit: contain;
      border-radius: 50%;
      border: 2px solid var(--gold);
      padding: 2px;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      color: var(--maroon);
      margin-bottom: 12px;
      font-family: Georgia, serif;
    }

    p {
      font-size: 14px;
      color: #665b57;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .btn {
      display: inline-block;
      width: 100%;
      background-color: var(--maroon);
      color: var(--background);
      border: none;
      padding: 14px 28px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(128, 31, 50, 0.15);
    }

    .btn:hover {
      background-color: #6E1725;
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .connection-status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 16px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: var(--gold);
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.6; }
      50% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0.6; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-container">
      <img src="/brand_logo.png" alt="Shree Banarasi Sarees Logo" class="logo">
    </div>
    <div class="connection-status">
      <span class="status-dot"></span>
      Offline Mode
    </div>
    <h1>You're Offline</h1>
    <p>Please check your internet connection. Shree Banarasi Sarees website needs an active connection to browse and order. Once you are back online, click below to retry.</p>
    <button class="btn" onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
